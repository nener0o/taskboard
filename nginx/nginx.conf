upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:80;
}

server {
    listen 80;
    server_name _;

    location /api/ {
        proxy_pass http://backend;
    }

    location /graphql {
        proxy_pass http://backend;
    }

    location = /robots.txt {
        proxy_pass http://backend;
    }

    location = /sitemap.xml {
        proxy_pass http://backend;
    }

    location /pages/ {
        proxy_pass http://backend;
    }

    location / {
        proxy_pass http://frontend;
    }
}
