services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: taskboard
      POSTGRES_PASSWORD: taskboard
      POSTGRES_DB: taskboard
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskboard"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: taskboard
      MINIO_ROOT_PASSWORD: taskboard-secret
    volumes:
      - minio:/data
    ports:
      - "9001:9001"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://taskboard:taskboard@db:5432/taskboard
      JWT_SECRET: change-me-in-real-deploy-32bytes
      SEED_DEMO: "true"
      PUBLIC_BASE_URL: http://localhost:8080
      FRONTEND_BASE_URL: http://localhost:8080
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: taskboard
      S3_ACCESS_KEY: taskboard
      S3_SECRET_KEY: taskboard-secret
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
  minio:
